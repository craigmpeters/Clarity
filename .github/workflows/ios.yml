name: iOS build and test

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    name: Build and test Clarity on iPhone simulator
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Select an available iPhone simulator
        id: simulator
        shell: bash
        run: |
          xcrun simctl list devices available --json > /tmp/clarity-simulators.json
          python3 - <<'PY'
          import json
          import os

          with open("/tmp/clarity-simulators.json") as file:
              runtimes = json.load(file)["devices"]
          candidates = []
          for runtime, devices in runtimes.items():
              if not runtime.startswith("com.apple.CoreSimulator.SimRuntime.iOS-"):
                  continue
              version = tuple(int(part) for part in runtime.rsplit("iOS-", 1)[1].split("-"))
              for device in devices:
                  if device.get("isAvailable") and device["name"].startswith("iPhone"):
                      candidates.append((version, device["name"], device["udid"]))
          if not candidates:
              raise SystemExit("No available iPhone simulator found in installed iOS runtimes")
          version, name, udid = max(candidates)
          print(f"Selected {name}, iOS {'.'.join(map(str, version))}, {udid}")
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              print(f"udid={udid}", file=output)
          PY
      - name: Build for testing
        run: |
          xcodebuild build-for-testing -project Clarity.xcodeproj -scheme Clarity \
            -destination "platform=iOS Simulator,id=${{ steps.simulator.outputs.udid }}"
      - name: Test
        run: |
          xcodebuild test-without-building -project Clarity.xcodeproj -scheme Clarity \
            -destination "platform=iOS Simulator,id=${{ steps.simulator.outputs.udid }}"
